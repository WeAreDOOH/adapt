<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Adapt.</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f1012;color:#f5f7f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 20%,rgba(153,86,190,.2),transparent 30%),radial-gradient(circle at 18% 85%,rgba(36,140,185,.2),transparent 34%),#0f1012}
    main{width:min(100%,430px);padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(30,31,34,.94);box-shadow:0 24px 70px rgba(0,0,0,.38)}
    .brand{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:750}.mark{width:34px;height:28px;border:2px solid #fff;border-radius:3px;display:grid;place-items:center}.mark:before{content:"";width:20px;height:14px;border:2px solid #4aa6d5;border-radius:2px;box-shadow:inset 0 0 0 4px #1e1f22}.dot{color:#4aa6d5}
    .eyebrow{margin:28px 0 8px;color:#8cc7e7;font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{font-size:2.55rem;line-height:1;margin:0 0 16px}p{color:#aeb3b8;line-height:1.55;margin:0 0 26px}
    button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;border-radius:10px;background:#4aa6d5;color:#071117;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#69b7df}button:disabled{opacity:.65;cursor:wait}
    .error{margin:16px 0 0;color:#ffad91;font-size:.88rem}.privacy{margin:18px 0 0;font-size:.72rem;color:#777f86;text-align:center}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true"></span><strong>Adapt<span class="dot">.</span></strong></div>
    <div class="eyebrow">DOOH creative adaptation toolkit</div>
    <h1>Welcome</h1>
    <p>Sign in with your DOOH.COM Microsoft account. Microsoft handles your password and two-factor authentication.</p>
    <button id="signIn" type="button"><span>Sign in with Microsoft</span><span aria-hidden="true">→</span></button>
    <p class="error" id="error" role="alert" hidden></p>
    <p class="privacy">Access is limited to the same approved users as Experiments.</p>
  </main>
  <script src="/msal-browser.min.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
